/* ===== Zustand ===== */
const KEY="englishByDanis.v1";
let S = load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.mods)return s}catch(e){}return {mods:{},xp:0,days:[],voice:"",slow:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function M(id){return S.mods[id]||(S.mods[id]={learned:[],quiz:0,write:0,speak:0,dlg:0})}
function touchDay(){const d=new Date().toISOString().slice(0,10);if(!S.days.includes(d)){S.days.push(d);save()}}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else if(n===0){d.setDate(d.getDate()-1);if(!S.days.includes(d.toISOString().slice(0,10)))break}else break}return n}
function pct(mod,lv){const m=M(mod.id);return Math.round(((m.learned.length/mod.w.length)*100+m.quiz+m.write+m.speak)/4)}
function lvPct(lv){return Math.round(lv.mods.reduce((a,m)=>a+pct(m),0)/lv.mods.length)}

/* ===== Sprache ===== */
const GREET="Hallo Jambo vergiss dein Ziel für 2028 nicht und motiviere dich";
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()||[]}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let _u=[];
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:12px;right:12px;bottom:18px;z-index:120;background:#1a1403;border:1px solid #d4af37;color:#f5d77a;padding:12px;border-radius:12px;font-size:14px;text-align:center";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",5000)}
function speak(text,lang="en-US"){
  if(!("speechSynthesis" in window)){toast("Dieser Browser unterstützt keine Sprachausgabe. Bitte Chrome (Android) oder Safari (iPhone) verwenden.");return}
  const ss=window.speechSynthesis;
  if(!voices.length)loadVoices();
  const base=lang.slice(0,2);
  const v=voices.find(v=>v.lang.replace("_","-")===lang)||voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(base));
  const go=()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;if(v)u.voice=v;
    u.rate=lang.startsWith("en")?(S.slow?0.65:0.9):1;u.volume=1;u.pitch=1;
    u.onerror=e=>{if(e.error&&e.error!=="canceled"&&e.error!=="interrupted")toast("Sprachausgabe-Fehler: "+e.error+" – Medienlautstärke prüfen / Stumm-Schalter aus.")};
    _u.push(u);if(_u.length>5)_u.shift();   /* Referenz halten (Chrome-Bug) */
    try{ss.resume()}catch(e){}
    ss.speak(u);
  };
  if(ss.speaking||ss.pending){try{ss.cancel()}catch(e){}setTimeout(go,80)}else go();   /* direkt im Tipp-Ereignis (iOS) */
}
let greeted=false;
function splash(){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:18px";
  d.innerHTML='<div class="logo" style="font-size:34px">ENGLISH<small style="font-size:13px">BY DANIS</small></div><div style="color:#f5d77a;font-weight:700;font-size:20px;line-height:1.4;max-width:420px">'+GREET+'</div><button class="btn" style="font-size:18px;padding:14px 30px">▶ Start</button>';
  document.body.appendChild(d);
  const go=()=>{greeted=true;speak(GREET,"de-DE");d.remove()};
  d.onclick=go;
}
window.addEventListener("load",splash);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(cb,err){
  if(!SR){err("Spracherkennung wird von diesem Browser nicht unterstützt (Chrome/Android oder Safari nutzen).");return}
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;
  r.onresult=e=>cb([...e.results[0]].map(a=>a.transcript));
  r.onerror=e=>err("Mikrofon-Fehler: "+e.error);
  r.onnomatch=()=>err("Nichts verstanden – nochmal versuchen.");
  try{r.start()}catch(e){err("Mikrofon konnte nicht gestartet werden.")}
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' äöüß]/g," ").replace(/\s+/g," ").trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  window.scrollTo(0,0);
}
function home(){
  touchDay();
  const xp=S.xp,words=Object.values(S.mods).reduce((a,m)=>a+m.learned.length,0);
  shell(`
  <div class="greet"><b>${GREET}</b><button class="btn sm" onclick="speak(GREET,'de-DE')">🔊</button></div>
  <div class="stats"><div class="stat"><b>${streak()}</b><span>Tage in Folge</span></div><div class="stat"><b>${words}</b><span>Wörter gelernt</span></div><div class="stat"><b>${xp}</b><span>Punkte</span></div></div>
  <h2>Wähle dein Level</h2>
  <div class="grid">${LEVELS.map(l=>`<button class="tile" onclick="level('${l.id}')"><div class="ic">${l.ic}</div><div><div class="t">${l.name}</div><div class="s">${l.cefr} · ${l.mods.length} Module</div><div class="bar"><i style="width:${lvPct(l)}%"></i></div></div></button>`).join("")}</div>
  <h2>Schnellstart</h2>
  <div class="grid"><button class="tile big" onclick="dailyMix()"><div class="ic">⚡</div><div class="x"><div class="t">Tages-Mix</div><div class="s">10 zufällige Wörter aus allen Levels mit Aussprache</div></div></button></div>`);
}
function level(id){
  const lv=LEVELS.find(l=>l.id===id);
  shell(`<button class="back" onclick="home()">‹ Zurück</button><h2>${lv.ic} ${lv.name} <span class="tag">${lv.cefr}</span></h2>
  <div class="grid">${lv.mods.map(m=>`<button class="tile" onclick="module('${lv.id}','${m.id}')"><div class="ic">${m.ic}</div><div><div class="t">${m.name}</div><div class="s">${m.w.length} Einträge</div><div class="bar"><i style="width:${pct(m)}%"></i></div></div></button>`).join("")}
  <button class="tile" onclick="dialog('${lv.id}')"><div class="ic">🎙️</div><div><div class="t">Gespräch</div><div class="s">App spricht – du antwortest</div><div class="bar"><i style="width:${M('dlg_'+lv.id).dlg}%"></i></div></div></button></div>`);
}
function module(lid,mid){
  const lv=LEVELS.find(l=>l.id===lid),m=lv.mods.find(x=>x.id===mid),st=M(mid);
  shell(`<button class="back" onclick="level('${lid}')">‹ ${lv.name}</button><h2>${m.ic} ${m.name}</h2>
  <div class="grid">
   <button class="tile" onclick="learn('${lid}','${mid}',0)"><div class="ic">🃏</div><div><div class="t">Lernen</div><div class="s">${st.learned.length}/${m.w.length} gelernt</div></div></button>
   <button class="tile" onclick="quiz('${lid}','${mid}')"><div class="ic">❓</div><div><div class="t">Quiz</div><div class="s">Bestwert ${st.quiz}%</div></div></button>
   <button class="tile" onclick="write('${lid}','${mid}')"><div class="ic">✍️</div><div><div class="t">Schreiben</div><div class="s">Hören &amp; tippen · ${st.write}%</div></div></button>
   <button class="tile" onclick="speakEx('${lid}','${mid}')"><div class="ic">🎤</div><div><div class="t">Sprechen</div><div class="s">Nachsprechen · ${st.speak}%</div></div></button>
  </div>
  <h2>Alle Einträge</h2><div class="panel list">${m.w.map(w=>`<div><span><b>${esc(w[0])}</b><br><small style="opacity:.7">${esc(w[1])}</small></span><button class="btn sm ghost" onclick="speak(${esc(JSON.stringify(w[0])).replace(/"/g,"&quot;")})">🔊</button></div>`).join("")}</div>`);
}
function find(lid,mid){const lv=LEVELS.find(l=>l.id===lid);return [lv,lv.mods.find(x=>x.id===mid)]}

/* Lernen */
function learn(lid,mid,i){
  const [lv,m]=find(lid,mid),w=m.w[i],st=M(mid);
  shell(`<button class="back" onclick="module('${lid}','${mid}')">‹ ${m.name}</button>
  <div class="prog">${i+1} / ${m.w.length}</div>
  <div class="panel"><div class="big-w">${esc(w[0])}</div><div class="sub" id="de" style="visibility:hidden">${esc(w[1])}</div>
  <div class="row"><button class="btn" id="sp">🔊 Anhören</button><button class="btn ghost" id="sh">Übersetzung</button></div></div>
  <div class="row"><button class="btn ghost" ${i?"":"disabled"} id="pv">‹ Zurück</button><button class="btn" id="nx">${i<m.w.length-1?"Weiter ›":"Fertig ✓"}</button></div>`);
  const say=()=>speak(w[0]);document.getElementById("sp").onclick=say;setTimeout(say,250);
  document.getElementById("sh").onclick=()=>{document.getElementById("de").style.visibility="visible"};
  document.getElementById("pv").onclick=()=>learn(lid,mid,i-1);
  document.getElementById("nx").onclick=()=>{if(!st.learned.includes(i)){st.learned.push(i);S.xp+=2}save();i<m.w.length-1?learn(lid,mid,i+1):module(lid,mid)};
}
/* Quiz */
function quiz(lid,mid){
  const [lv,m]=find(lid,mid);const pool=lv.mods.flatMap(x=>x.w);
  const qs=shuffle(m.w).slice(0,10).map(w=>{const rev=Math.random()<.5;
    const wrong=shuffle(pool.filter(p=>p[0]!==w[0])).slice(0,3);
    return {q:rev?w[1]:w[0],a:rev?w[0]:w[1],opts:shuffle([w,...wrong]).map(x=>rev?x[0]:x[1]),en:rev?null:w[0],lang:rev?"de":"en"}});
  let i=0,ok=0;
  const next=()=>{
    if(i>=qs.length){const p=Math.round(ok/qs.length*100),st=M(mid);st.quiz=Math.max(st.quiz,p);S.xp+=ok*3;save();return result(lid,mid,"Quiz",p)}
    const q=qs[i];
    shell(`<button class="back" onclick="module('${lid}','${mid}')">‹ Abbrechen</button><div class="prog">Frage ${i+1} / ${qs.length}</div>
    <div class="panel"><div class="big-w" style="font-size:24px">${esc(q.q)}</div><div class="row" style="justify-content:center">${q.en?'<button class="btn sm ghost" id="sp" style="flex:0">🔊</button>':""}</div>
    ${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`);
    if(q.en){document.getElementById("sp").onclick=()=>speak(q.en);speak(q.en)}
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const good=q.opts[b.dataset.k]===q.a;if(good)ok++;
      document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[x.dataset.k]===q.a)x.classList.add("ok")});
      if(!good)b.classList.add("bad");
      if(!q.en)speak(q.a);
      setTimeout(()=>{i++;next()},1100)});
  };next();
}
/* Schreiben */
function write(lid,mid){
  const [lv,m]=find(lid,mid);const qs=shuffle(m.w).slice(0,8);let i=0,ok=0;
  const next=()=>{
    if(i>=qs.length){const p=Math.round(ok/qs.length*100),st=M(mid);st.write=Math.max(st.write,p);S.xp+=ok*4;save();return result(lid,mid,"Schreiben",p)}
    const w=qs[i],mode=i%2===0?"dikt":"uebs";
    shell(`<button class="back" onclick="module('${lid}','${mid}')">‹ Abbrechen</button><div class="prog">${i+1} / ${qs.length} · ${mode==="dikt"?"Diktat: Tippe, was du hörst":"Übersetze ins Englische"}</div>
    <div class="panel">${mode==="dikt"?'<div class="big-w">🔊</div><div class="row"><button class="btn" id="sp">Nochmal anhören</button></div>':`<div class="big-w" style="font-size:24px">${esc(w[1])}</div>`}
    <input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Englisch eingeben …">
    <div class="row"><button class="btn" id="ck">Prüfen</button></div><div class="fb" id="fb"></div></div>`);
    const inp=document.getElementById("in");
    if(mode==="dikt"){document.getElementById("sp").onclick=()=>speak(w[0]);setTimeout(()=>speak(w[0]),300)}
    let done=false;
    const check=()=>{
      if(done){i++;return next()}
      done=true;const good=norm(inp.value)===norm(w[0]);if(good)ok++;
      document.getElementById("fb").innerHTML=good?'<span class="ok-t">✓ Richtig!</span>':`<span class="bad-t">✗ Richtig wäre:</span><br>${esc(w[0])}`;
      document.getElementById("ck").textContent="Weiter ›";speak(w[0]);
    };
    document.getElementById("ck").onclick=check;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
  };next();
}
/* Sprechen */
function speakEx(lid,mid){
  const [lv,m]=find(lid,mid);const qs=shuffle(m.w).slice(0,6);let i=0,ok=0;
  const next=()=>{
    if(i>=qs.length){const p=Math.round(ok/qs.length*100),st=M(mid);st.speak=Math.max(st.speak,p);S.xp+=ok*5;save();return result(lid,mid,"Sprechen",p)}
    const w=qs[i];
    shell(`<button class="back" onclick="module('${lid}','${mid}')">‹ Abbrechen</button><div class="prog">${i+1} / ${qs.length} · Sprich nach</div>
    <div class="panel"><div class="big-w">${esc(w[0])}</div><div class="sub">${esc(w[1])}</div>
    <div class="row"><button class="btn ghost" id="sp">🔊 Vorsprechen</button><button class="btn" id="mic">🎤 Sprechen</button></div>
    <div class="fb" id="fb"></div><div class="row"><button class="btn ghost" id="sk">Überspringen ›</button></div></div>`);
    speak(w[0]);
    document.getElementById("sp").onclick=()=>speak(w[0]);
    document.getElementById("sk").onclick=()=>{i++;next()};
    document.getElementById("mic").onclick=()=>{
      const fb=document.getElementById("fb");fb.textContent="🎧 Ich höre zu …";
      listen(alts=>{const t=norm(w[0]);const good=alts.some(a=>{const n=norm(a);return n===t||similar(n,t)>=.8});
        if(good)ok++;fb.innerHTML=good?'<span class="ok-t">✓ Sehr gut!</span>':`<span class="bad-t">Verstanden: „${esc(alts[0])}“</span>`;
        document.getElementById("sk").textContent="Weiter ›";document.getElementById("sk").onclick=()=>{i++;next()}},
        msg=>{fb.innerHTML=`<span class="bad-t">${esc(msg)}</span>`});
    };
  };next();
}
function similar(a,b){const A=a.split(" "),B=b.split(" ");const hit=B.filter(x=>A.includes(x)).length;return hit/Math.max(B.length,1)}
/* Gespräch */
function dialog(lid){
  const lv=LEVELS.find(l=>l.id===lid);let i=0;const st=M("dlg_"+lid);
  const next=()=>{
    if(i>=lv.dlg.length){st.dlg=100;S.xp+=15;save();return result(lid,null,"Gespräch",100,true)}
    const [q,a]=lv.dlg[i];
    shell(`<button class="back" onclick="level('${lid}')">‹ Abbrechen</button><div class="prog">Gespräch ${i+1} / ${lv.dlg.length}</div>
    <div class="panel"><div class="tag">Claude</div><div class="big-w" style="font-size:22px">${esc(q)}</div>
    <div class="row"><button class="btn ghost" id="sp">🔊 Nochmal</button><button class="btn ghost" id="mic">🎤 Sprechen</button></div>
    <textarea id="in" rows="3" placeholder="Deine Antwort auf Englisch …"></textarea>
    <div class="row"><button class="btn" id="ok">Antworten</button></div><div class="fb" id="fb"></div></div>`);
    speak(q);
    document.getElementById("sp").onclick=()=>speak(q);
    document.getElementById("mic").onclick=()=>{const fb=document.getElementById("fb");fb.textContent="🎧 Ich höre zu …";listen(al=>{document.getElementById("in").value=al[0];fb.textContent=""},msg=>fb.innerHTML=`<span class="bad-t">${esc(msg)}</span>`)};
    let done=false;
    document.getElementById("ok").onclick=()=>{
      if(done){i++;return next()}
      const v=document.getElementById("in").value.trim();if(!v){document.getElementById("fb").innerHTML='<span class="bad-t">Bitte schreibe oder sprich eine Antwort.</span>';return}
      done=true;document.getElementById("fb").innerHTML=`<span class="ok-t">Gut gemacht!</span><br><small>Musterantwort:</small><br>${esc(a)}`;
      document.getElementById("ok").textContent="Weiter ›";speak(a);S.xp+=3;save();
    };
  };next();
}
/* Tages-Mix */
function dailyMix(){
  const all=LEVELS.flatMap(l=>l.mods.flatMap(m=>m.w));const qs=shuffle(all).slice(0,10);let i=0;
  const next=()=>{
    if(i>=qs.length){S.xp+=10;save();return result(null,null,"Tages-Mix",100,true)}
    const w=qs[i];
    shell(`<button class="back" onclick="home()">‹ Beenden</button><div class="prog">${i+1} / ${qs.length}</div>
    <div class="panel"><div class="big-w">${esc(w[0])}</div><div class="sub" id="de" style="visibility:hidden">${esc(w[1])}</div>
    <div class="row"><button class="btn" id="sp">🔊</button><button class="btn ghost" id="sh">Übersetzung</button></div></div>
    <div class="row"><button class="btn" id="nx">Weiter ›</button></div>`);
    speak(w[0]);document.getElementById("sp").onclick=()=>speak(w[0]);
    document.getElementById("sh").onclick=()=>document.getElementById("de").style.visibility="visible";
    document.getElementById("nx").onclick=()=>{i++;next()};
  };next();
}
function result(lid,mid,title,p,simple){
  const back=mid?`module('${lid}','${mid}')`:(lid?`level('${lid}')`:"home()");
  shell(`<div class="panel" style="text-align:center"><div style="font-size:54px">${p>=80?"🏆":p>=50?"👍":"💪"}</div><h2>${title} abgeschlossen</h2>
  ${simple?"":`<div class="big-w">${p}%</div>`}<p>${p>=80?"Stark!":"Weiter so – Wiederholung macht den Meister."}<br><b style="color:var(--gold2)">${GREET}</b></p>
  <div class="row"><button class="btn" onclick="${back}">Weiter</button></div></div>`);
  speak(p>=80?"Great job!":"Keep going!");
}
/* Einstellungen */
function settings(){
  shell(`<button class="back" onclick="home()">‹ Zurück</button><h2>Einstellungen</h2>
  <div class="panel"><label><input type="checkbox" id="slow" ${S.slow?"checked":""}> Langsame Aussprache</label>
  <div class="row"><button class="btn ghost" onclick="speak('This is how I sound.')">🔊 Englisch testen</button><button class="btn ghost" onclick="speak('Hallo Danis, das ist ein Test.','de-DE')">🔊 Deutsch testen</button></div>
  <p style="opacity:.7;font-size:13px">Stimmen gefunden: ${("speechSynthesis" in window)?voices.length:"keine Unterstützung"}${location.protocol==="file:"?" · Datei lokal geöffnet":""}. Kein Ton? Medienlautstärke hochdrehen und den Stumm-Schalter (iPhone) ausschalten.</p></div>
  <div class="panel"><b>Fortschritt sichern</b><p style="opacity:.7;font-size:14px">Der Fortschritt liegt lokal auf diesem Gerät (localStorage). Mit Export/Import kannst du ihn sichern oder auf ein anderes Gerät übertragen.</p>
  <div class="row"><button class="btn" id="ex">Export</button><button class="btn ghost" id="im">Import</button></div>
  <textarea id="io" rows="4" placeholder="Export-Text hier / zum Import einfügen" style="font-size:12px"></textarea></div>
  <div class="panel"><button class="btn ghost" id="rs" style="width:100%">Fortschritt zurücksetzen</button></div>`);
  document.getElementById("slow").onchange=e=>{S.slow=e.target.checked;save()};
  document.getElementById("ex").onclick=()=>{const t=document.getElementById("io");t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}};
  document.getElementById("im").onclick=()=>{try{const o=JSON.parse(document.getElementById("io").value);if(o.mods){S=o;save();home()}}catch(e){alert("Ungültiger Export-Text.")}};
  document.getElementById("rs").onclick=()=>{if(confirm("Wirklich alles zurücksetzen?")){S={mods:{},xp:0,days:[],voice:"",slow:false};save();home()}};
}
home();
</script>
</body>
</html>
